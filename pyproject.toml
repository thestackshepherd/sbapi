[project]
name = "sbapi"
version = "0.1.0"
description = "Space Balls API (SBAPI) - The SpaceBalls API"
readme = "README.md"
authors = [
    { name = "thestackshepherd", email = "jadenmschwartz00@gmail.com" }
]

requires-python = ">=3.14"

dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "psycopg>=3.3.4",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
# Wiki -> Postgres data pipeline (src/sbapi/ingest). `uv sync --extra ingest`
ingest = [
    "jsonschema>=4.23",
    "mwparserfromhell>=0.6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
sbapi = "sbapi.app.wsgi:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"