[project]
name = "sbapi"
version = "0.1.0"
description = "Space Balls API (SBAPI) - The SpaceBalls API"
readme = "README.md"

authors = [
    { name = "thestackshepherd", email = "jadenmschwartz00@gmail.com" }
]

requires-python = ">=3.15"

dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
sbapi = "sbapi.app.wsgi:main"
populate_actors = "sbapi.app.scripts.database_populate_actors:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
