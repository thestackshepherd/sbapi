[project]
name = "sbapi"
version = "0.1.0"
description = "Space Balls API (SBAPI) - The SpaceBalls API"
readme = "README.md"
authors = [
    { name = "thestackshepherd", email = "jadenmschwartz00@gmail.com" }
]

requires-python = ">=3.14"

dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
# Wiki -> Postgres data pipeline (src/sbapi/ingest). `uv sync --extra ingest`
ingest = [
    "jsonschema>=4.23",
    "mwparserfromhell>=0.6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
sbapi = "sbapi.app.wsgi:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["src/sbapi/infra"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Models refer to each other by string name across files; __init__ files re-export.
"src/sbapi/app/models/*.py" = ["F821"]
"__init__.py" = ["F401"]
"src/sbapi/app/models/__init__.py" = ["I001"]  # import order is grouped by domain
