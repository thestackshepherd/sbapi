log_format upstream_log '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time';

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    access_log /dev/stdout upstream_log;

    # Docker's embedded DNS; short TTL so scaled replicas are picked up.
    resolver 127.0.0.11 valid=5s ipv6=off;

    gzip on;
    gzip_types application/json text/css application/javascript;

    location /api/ {
        # Variable form forces re-resolution via the resolver above. With no
        # URI part on proxy_pass, the original /api/... URI is forwarded as-is.
        set $api_upstream http://app:8080;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;

        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
