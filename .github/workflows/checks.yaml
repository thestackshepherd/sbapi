# Shared checks: lint, build the database from the schema, run the tests.
# Not triggered directly; dev.yaml and main.yaml call it.
name: Checks

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uv run --extra ingest ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sbapi_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      SBAPI_TEST_DSN: postgresql://postgres:postgres@localhost:5432/sbapi_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the database from the schema
        run: |
          psql -h localhost -U postgres -d sbapi_test_db -v ON_ERROR_STOP=1 \
            -f src/sbapi/app/database/sbapidatabase_schema.sql
          # Running it twice proves the schema is re-runnable (IF NOT EXISTS).
          psql -h localhost -U postgres -d sbapi_test_db -v ON_ERROR_STOP=1 \
            -f src/sbapi/app/database/sbapidatabase_schema.sql
      - name: SQLAlchemy models configure
        run: |
          uv run python - <<'PY'
          from sqlalchemy.orm import configure_mappers
          import sbapi.app.models
          configure_mappers()
          PY
      - name: ERD is up to date
        run: |
          uv run python scripts/generate_erd.py
          git diff --exit-code docs/ERD.md
      - name: Tests (includes the load-twice database test)
        run: uv run --extra ingest pytest -q
