services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-sbapi_dev_db}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - sbapi_db_data:/var/lib/postgresql
      # Runs once, on first start of an empty volume.
      - ./src/sbapi/app/database/sbapi_devdb_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-sbapi_dev_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_DRIVER: ${DATABASE_DRIVER:-postgresql+psycopg}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-sbapi_dev_db}
      FORWARDED_ALLOW_IPS: "*"
    deploy:
      replicas: ${APP_REPLICAS:-3}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PROXY_HOST_PORT:-8080}:80"
    volumes:
      - ./src/sbapi/infra/local/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/sbapi/infra/local/web:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  sbapi_db_data:
